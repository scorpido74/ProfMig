name: Validate ProfMig

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: PowerShell validation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display PowerShell version
        shell: powershell
        run: |
          $PSVersionTable

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $files = Get-ChildItem `
              -Path . `
              -Recurse `
              -File `
              -Include *.ps1, *.psm1, *.psd1

          if (-not $files) {
              throw 'No PowerShell files found.'
          }

          $errorsFound = $false

          foreach ($file in $files) {

              Write-Host "Validating: $($file.FullName)"

              $tokens = $null
              $errors = $null

              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              )

              if ($errors.Count -gt 0) {

                  $errorsFound = $true

                  foreach ($error in $errors) {
                      Write-Error "$($file.FullName): $($error.Message)"
                  }
              }
          }

          if ($errorsFound) {
              throw 'PowerShell syntax validation failed.'
          }

          Write-Host 'All PowerShell files passed syntax validation.'

      - name: Validate PowerShell data files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $dataFiles = Get-ChildItem `
              -Path . `
              -Recurse `
              -File `
              -Filter *.psd1

          foreach ($file in $dataFiles) {

              Write-Host "Importing data file: $($file.FullName)"

              Import-PowerShellDataFile `
                  -Path $file.FullName `
                  -ErrorAction Stop |
                  Out-Null
          }

          Write-Host 'All PowerShell data files passed validation.'